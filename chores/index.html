<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- This is a redirect page, not content. Keep it out of search results. -->
  <meta name="robots" content="noindex" />
  <title>Kids Chore Chart — Kerigami</title>

  <script>
    /* =======================================================================
       STORE LINKS — the only things you should ever need to change in here.
       If an app's App Store or Google Play address changes, update it below
       (and in the two matching button links near the bottom of this file).
       ======================================================================= */

    // Apple App Store link for Kids Chore Chart
    var IOS_URL = "https://apps.apple.com/app/id6761321321";

    // Google Play link for Kids Chore Chart
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.kidschorechart.app";

    // iOS campaign link — LEAVE THIS EMPTY FOR NOW.
    // Apple only creates campaign tracking links (in App Store Connect) after an
    // app has collected some analytics, and that link needs a "pt" provider token
    // we don't have yet. When Apple gives you the link, paste it here and put
    // {campaign} where the campaign name should go. Setting this automatically
    // switches iPhone/iPad visitors over to the tagged link; leaving it empty
    // keeps the normal App Store link above. Do not make up a value.
    var IOS_CAMPAIGN_TEMPLATE = "";

    /* ---- Device detection (no need to touch anything below this line) ---- */
    var ua = navigator.userAgent || "";
    // An iPad in desktop mode reports itself as a Mac, so we also check for a
    // touch screen — without this, those iPads wrongly fall through to desktop.
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);

    // Read an optional campaign tag from the web address, e.g. ?c=qr-print
    // Only letters, numbers, dash and underscore are allowed, max 40 characters;
    // anything else is ignored so nothing untrusted is ever put into a link.
    var campaign = "";
    try {
      var raw = new URLSearchParams(window.location.search || "").get("c");
      if (raw && /^[A-Za-z0-9_-]{1,40}$/.test(raw)) {
        campaign = raw;
      }
    } catch (e) {
      campaign = "";
    }

    // Send the visitor to the right store. We use location.replace (not a normal
    // link) so no history entry is left behind — the back button then returns
    // people to wherever they came from instead of looping back here.
    if (isIOS) {
      var iosTarget = IOS_URL;
      if (IOS_CAMPAIGN_TEMPLATE) {
        iosTarget = IOS_CAMPAIGN_TEMPLATE.replace("{campaign}", campaign);
      }
      window.location.replace(iosTarget);
    } else if (isAndroid) {
      var androidTarget = ANDROID_URL;
      if (campaign) {
        // referrer must be URL-encoded: utm_source=qr&utm_medium=qr&utm_campaign=<c>
        androidTarget += "&referrer=utm_source%3Dqr%26utm_medium%3Dqr%26utm_campaign%3D" + campaign;
      }
      window.location.replace(androidTarget);
    }
    // Any other device (laptop, desktop, an unusual scanner, or JavaScript
    // turned off) simply sees the card below, with both store buttons.
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      /* Same system font stack the rest of kerigami.com uses */
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      /* Soft teal-to-peach wash, echoing the site's origami background */
      background: linear-gradient(160deg, #EDFAFA 0%, #FEFEFE 45%, #FFF5ED 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    /* Frosted card matching the site's cards: rounded, mint border, teal glow */
    .card {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(176, 235, 200, 0.5);
      border-radius: 1.25rem;
      box-shadow: 0 20px 60px rgba(142, 212, 176, 0.25), 0 8px 20px rgba(0, 0, 0, 0.10);
      padding: 2.5rem 2rem;
      text-align: center;
    }
    /* Brand gradient accent bar across the top, like the homepage app card */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #5BBEC4, #72C89A, #E8956E, #D8825A);
    }
    .app-name {
      margin: 0 0 0.5rem;
      font-size: 1.7rem;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #2D7A82; /* teal-700 */
    }
    .tagline {
      margin: 0 0 1.75rem;
      font-size: 1.05rem;
      line-height: 1.5;
      color: #6B7280; /* gray-500 */
    }
    /* Classic dark store buttons — instantly recognizable, high contrast on the
       light card, and built from the site's own gray-900 ink colour. */
    .store-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 0.85rem;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(17, 24, 39, 0.18);
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .store-btn + .store-btn { margin-top: 0.85rem; }
    .store-btn:hover {
      background: #1F2937;
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(17, 24, 39, 0.24);
    }
    .store-btn:active { transform: translateY(0); }
    .store-ico { width: 24px; height: 24px; flex-shrink: 0; fill: #ffffff; }
    .store-txt { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
    .store-sm { font-size: 0.7rem; font-weight: 500; opacity: 0.85; }
    .store-lg { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.01em; }
    @media (prefers-reduced-motion: reduce) {
      .store-btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="app-name">Kids Chore Chart</h1>
    <p class="tagline">Get Kids Chore Chart for your phone.</p>

    <!-- Fallback links for laptops, desktops, and anything we can't identify.
         These mirror the STORE LINKS at the top of the script and work even
         with JavaScript turned off. -->
    <a class="store-btn" href="https://apps.apple.com/app/id6761321321">
      <svg class="store-ico" viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50.1-84.5-18.9-27-47.5-41.8-85.1-44.7-35.8-2.8-74.7 20.9-88.9 20.9-15 0-49.7-19.9-76.6-19.4-39.5.6-76.2 23-96.5 58.6-41.2 71.4-10.5 176.8 29.5 234.7 19.6 28.5 42.9 60.4 73.5 59.3 29.5-1.2 40.7-19 76.4-19 35.6 0 45.7 19 76.9 18.3 31.8-.5 51.9-28.7 71.3-57.4 22.5-33 31.7-64.9 32.1-66.5-.7-.3-61.6-23.7-62.2-93.9zM256.2 91.1c16.3-19.7 27.2-47.2 24.2-74.6-23.4 1-51.7 15.6-68.5 35.3-15.1 17.4-28.3 45.4-24.8 72.2 26.1 2 52.8-13.2 69.1-32.9z"/></svg>
      <span class="store-txt"><span class="store-sm">Download on the</span><span class="store-lg">App Store</span></span>
    </a>
    <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.kidschorechart.app">
      <svg class="store-ico" viewBox="0 0 512 512" aria-hidden="true"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
      <span class="store-txt"><span class="store-sm">Get it on</span><span class="store-lg">Google Play</span></span>
    </a>
  </main>
</body>
</html>
