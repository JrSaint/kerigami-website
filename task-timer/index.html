  <link rel="icon" href="/brain-logo.webp" type="image/webp" />
  <script>
    // Device-detecting store redirect. Mobile users go straight to their store;
    // desktop / unknown fall through to the chooser card below.
    (function () {
      var ua = navigator.userAgent || navigator.vendor || '';
      var APP_STORE = 'https://apps.apple.com/us/app/kerigami-task-timer/id6767952551';
      var PLAY = 'https://play.google.com/store/apps/details?id=com.kerigami.app';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iphone|ipad|ipod/i.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isAndroid) { location.replace(PLAY); }
      else if (isIOS) { location.replace(APP_STORE); }
    })();
  </script>

    a.store { display: inline-flex; align-items: center; justify-content: center; gap: 10px;

              transition: background .2s; }
    a.ios { background: #111827; color: #fff; }

    a.play:hover { background: #2D7A82; }
    a.store svg { width: 20px; height: 20px; }
    .home { display: inline-block; margin-top: 22px; color: #3A929A; font-size: .85rem; text-decoration: none; }
    .home:hover { text-decoration: underline; }
